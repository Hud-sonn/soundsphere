<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#0A0908;font-family:Helvetica,Arial,sans-serif;">
  <div style="background:#0A0908;padding:40px 20px;">
    <div style="max-width:440px;margin:0 auto;">
      <h1 style="color:#C6AC8F;font-size:14px;letter-spacing:4px;text-transform:uppercase;margin:0 0 24px;">Soundsphere</h1>
      <p style="color:#A89890;font-size:14px;margin:0 0 8px;">Hi {{ .Email }},</p>
      <p style="color:#A89890;font-size:14px;margin:0 0 24px;">Enter this code in the app to continue:</p>
      <div style="background:#22333B;border-radius:12px;padding:28px;text-align:center;margin:0 0 24px;">
        <span style="font-size:40px;font-weight:bold;letter-spacing:10px;color:#C6AC8F;">{{ .Token }}</span>
      </div>
      <p style="color:#6B5B53;font-size:12px;margin:0 0 8px;">This code expires after a short time.</p>
      <p style="color:#6B5B53;font-size:12px;margin:0;">If you didn't request this, you can safely ignore this email.</p>
    </div>
  </div>
</body>
</html>
