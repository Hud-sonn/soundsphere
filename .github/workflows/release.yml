name: Release

# Builds, signs, and publishes the release APKs when a version tag is pushed
# (e.g. v1.1). The APK asset names match exactly what Updater.kt's
# parseAssets() looks for, so the in-app update flow picks up releases
# published by this workflow with no further changes.
#
# Required repository secrets (set by the project owner):
#   KEYSTORE            - the release keystore, base64-encoded
#   KEYSTORE_PASSWORD   - keystore password
#   KEY_ALIAS           - key alias inside the keystore
#   KEY_PASSWORD        - key password
#   LASTFM_API_KEY      - LastFM API key (optional, build-time field)
#   LASTFM_SECRET       - LastFM API secret (optional, build-time field)
#
# Releases are published with the built-in GITHUB_TOKEN (permissions:
# contents: write), so no PAT is required.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build and sign release APKs (foss + gms)
        run: |
          ./gradlew --console=plain :app:assembleFossRelease :app:assembleGmsRelease --warning-mode summary
        env:
          # Point Gradle's release signingConfig at the decoded keystore and
          # supply the credentials via the env vars build.gradle.kts reads.
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Stage APK assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          FOSS_APK="$(find app/build/outputs/apk/foss/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' ! -name '*-unaligned.apk' | head -n 1)"
          GMS_APK="$(find app/build/outputs/apk/gms/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' ! -name '*-unaligned.apk' | head -n 1)"
          test -n "$FOSS_APK"
          test -n "$GMS_APK"
          cp "$FOSS_APK" "$RUNNER_TEMP/assets/Soundsphere.apk"
          cp "$GMS_APK" "$RUNNER_TEMP/assets/Soundsphere-with-Google-Cast.apk"
          echo "Staged assets:"
          ls -la "$RUNNER_TEMP/assets"

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"
          : > "$NOTES_FILE"

          if [ -f changelog.md ] && bash .github/scripts/parse_changelog.sh "$TAG" changelog.md > "$NOTES_FILE" 2>/dev/null; then
            echo "Release notes sourced from changelog.md"
          fi

          if [ ! -s "$NOTES_FILE" ]; then
            PREV_TAG="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            if [ -n "$PREV_TAG" ]; then
              RANGE="$PREV_TAG..$TAG"
            else
              RANGE="$TAG"
            fi
            COMMITS="$(git log --no-merges --pretty=format:%s "$RANGE")"
            {
              printf '### Added\n'
              printf '%s\n' "$COMMITS" | grep -iE '^(feat|add)(\(|:)' | sed 's/^/- /' || true
              printf '\n### Changed\n'
              printf '%s\n' "$COMMITS" | grep -iEv '^(feat|add|fix)(\(|:)' | sed 's/^/- /' || true
              printf '\n### Fixed\n'
              printf '%s\n' "$COMMITS" | grep -iE '^fix(\(|:)' | sed 's/^/- /' || true
            } > "$NOTES_FILE"
            echo "Release notes sourced from git history since ${PREV_TAG:-initial commit}"
          fi

          test -s "$NOTES_FILE"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Delete existing release if present (force-pushed tag may leave a
          # stale release behind whose assets can't be replaced via edit).
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            "$RUNNER_TEMP"/assets/*.apk
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Clean up signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
